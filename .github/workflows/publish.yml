name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (used when running on main)
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository == 'jnv/lists-manage' &&
      github.event_name == 'workflow_dispatch' &&
      !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      statuses: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.13.0"
          cache: npm
      - name: Validate release source
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          case "$BUMP" in patch|minor|major) ;; *) exit 1 ;; esac
      - name: Use release npm version
        run: npm install --global npm@11.20.0
      - run: npm ci
      - name: Prepare version commit
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          npm version "$BUMP" --no-git-tag-version
          version=$(node --print "require('./package.json').version")
          tag="v$version"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "Tag $tag already exists" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m "chore: release $tag"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "RELEASE_BRANCH=release/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Make version commit available for build status
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git push origin "HEAD:refs/heads/$RELEASE_BRANCH"
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - name: Record successful build on the tested version commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$(git rev-parse HEAD)" \
            -f state=success -f context=build \
            -f description='Release lint, typecheck, and tests passed' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Push version commit and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$RELEASE_TAG"
      - name: Start publishing from the release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish.yml --ref "$RELEASE_TAG" -f bump=patch
          echo "### Prepared $RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo 'Publishing continues in a separate Release run on that tag.' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary release branch
        if: always() && steps.candidate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$RELEASE_BRANCH"

  publish:
    if: >-
      github.repository == 'jnv/lists-manage' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.13.0"
          cache: npm
      - name: Validate release
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { appendFileSync, readFileSync } from 'node:fs'
          import path from 'node:path'
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'))
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'))
          assert.match(version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/,
            'Only stable releases are supported')
          assert.equal(process.env.GITHUB_REF_NAME, `v${version}`)
          assert.equal(lock.version, version)
          assert.equal(lock.packages[''].version, version)
          appendFileSync(process.env.GITHUB_ENV,
            `RELEASE_VERSION=${version}\nTARBALL=${path.join(process.env.RUNNER_TEMP, `jnv-lists-manage-${version}.tgz`)}\n`)
          NODE
      - name: Use npm with trusted publishing support
        run: npm install --global npm@11.20.0
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - name: Pack release
        run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Smoke-test packed CLI
        run: |
          smoke_dir=$(mktemp -d)
          cd "$smoke_dir"
          npm init --yes
          npm install --ignore-scripts --no-audit --no-fund "$TARBALL"
          ./node_modules/.bin/lists-manage --help
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { execFileSync } from 'node:child_process'
          import { stripVTControlCharacters } from 'node:util'
          const output = execFileSync('./node_modules/.bin/lists-manage', ['--version'], { encoding: 'utf8' })
          assert.equal(stripVTControlCharacters(output).trim(), `lists-manage ${process.env.RELEASE_VERSION}`)
          NODE
      - name: Prepare GitHub release with generated notes and package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft > "$RUNNER_TEMP/release-is-draft"; then
            if test "$(cat "$RUNNER_TEMP/release-is-draft")" != true; then
              echo 'The GitHub release is already published; refusing to modify it.' >&2
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" "$TARBALL" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$TARBALL" \
              --draft --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
      - name: Publish tested tarball with provenance
        run: npm publish "$TARBALL" --access public --provenance --ignore-scripts --registry=https://registry.npmjs.org
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --draft=false
          gh release view "$GITHUB_REF_NAME" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
