name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'jnv/lists-manage'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.13.0"
          cache: npm
      - name: Validate release
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { appendFileSync, readFileSync } from 'node:fs'
          import path from 'node:path'
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'))
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'))
          assert.match(version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/,
            'Only stable releases are supported')
          assert.equal(process.env.GITHUB_REF_NAME, `v${version}`)
          assert.equal(lock.version, version)
          assert.equal(lock.packages[''].version, version)
          appendFileSync(process.env.GITHUB_ENV,
            `RELEASE_VERSION=${version}\nTARBALL=${path.join(process.env.RUNNER_TEMP, `jnv-lists-manage-${version}.tgz`)}\n`)
          NODE
      - name: Use npm with trusted publishing support
        run: npm install --global npm@11.20.0
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - name: Pack release
        run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Smoke-test packed CLI
        run: |
          smoke_dir=$(mktemp -d)
          cd "$smoke_dir"
          npm init --yes
          npm install --ignore-scripts --no-audit --no-fund "$TARBALL"
          ./node_modules/.bin/lists-manage --help
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { execFileSync } from 'node:child_process'
          import { stripVTControlCharacters } from 'node:util'
          const output = execFileSync('./node_modules/.bin/lists-manage', ['--version'], { encoding: 'utf8' })
          assert.equal(stripVTControlCharacters(output).trim(), `lists-manage ${process.env.RELEASE_VERSION}`)
          NODE
      - name: Publish tested tarball with provenance
        run: npm publish "$TARBALL" --access public --provenance --ignore-scripts --registry=https://registry.npmjs.org
